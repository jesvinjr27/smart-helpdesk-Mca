<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Help Desk API - Swagger UI Documentation & Testing</title>
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" >
  <link rel="icon" type="image/png" href="https://fastapi.tiangolo.com/img/favicon.png">
  <style>
    html {
      box-sizing: border-box;
      overflow: -moz-scrollbars-vertical;
      overflow-y: scroll;
    }
    *, *:before, *:after {
      box-sizing: inherit;
    }
    body {
      margin:0;
      background: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .topbar-banner {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: white;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .topbar-banner h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topbar-badge {
      background: #00d2d3;
      color: #0b1e36;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .topbar-links a {
      color: #e0e7ff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      margin-left: 16px;
      padding: 6px 12px;
      border-radius: 6px;
      background: rgba(255,255,255,0.1);
      transition: all 0.2s;
    }
    .topbar-links a:hover {
      background: rgba(255,255,255,0.25);
      color: white;
    }
    .swagger-ui .topbar { display: none; }
  </style>
</head>
<body>
  <div class="topbar-banner">
    <h1>
      <span>🎫 Smart Help Desk & Ticket Management</span>
      <span class="topbar-badge">v1.0.0 OpenAPI</span>
    </h1>
    <div class="topbar-links">
      <a href="http://localhost:8000/docs" target="_blank">🚀 Open Live Backend Docs</a>
      <a href="SWAGGER_TESTING_GUIDE.md" target="_blank">📖 Testing Guide</a>
      <a href="openapi.json" target="_blank">📄 Download openapi.json</a>
    </div>
  </div>

  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"> </script>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"> </script>
  <script>
    window.onload = function() {
      // Build a system
      const ui = SwaggerUIBundle({
        url: "openapi.json",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "StandaloneLayout",
        persistAuthorization: true,
        displayRequestDuration: true,
        filter: true,
        defaultModelsExpandDepth: -1
      });
      window.ui = ui;
    };
  </script>
</body>
</html>
