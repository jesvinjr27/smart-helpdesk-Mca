services:
  - type: web
    name: smart-helpdesk-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python database/seed/seed.py && python backend/scripts/migrate_org_structure.py && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: API_V1_STR
        value: "/api/v1"
      - key: SECRET_KEY
        value: "smart-helpdesk-production-super-secret-key-2026-mca-project"
      - key: DATABASE_URL
        value: "sqlite:///./smart_helpdesk.db"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
